# Public export manifest — codestrata-platform is the single source of truth.
#
# Destination repositories are generated mirrors. Do not edit them directly.
# Export staging only; this file never pushes or creates remote repositories.
#
# Each export declares:
#   owner: GitHub organization (CodeStrata)
#   repository: GitHub repository name
#   visibility: public | private
#   destination_repository: legacy alias of repository (kept for compatibility)
#
# Public (Community): codestrata-engine, codestrata-examples
# Private mirrors: codestrata-vscode, codestrata-docs
# (codestrata-cursor export retired in Slice 12.2 — product source removed in 12.1)
#
# Phase 14.2+: this file is the authoritative Community release boundary.
# Do not rely only on .gitignore for release inclusion.

version: 2
manifest_id: codestrata.community_release
staging_directory: .export-staging
source_of_truth: codestrata-platform

release:
  required_legal_files:
    - LICENSE
    - SECURITY.md
  permitted_config_examples:
    - .env.example
    - codestrata.toml
  forbidden_internal_paths:
    - platform/
    - infrastructure/
    - governance/
    - knowledge/
    - .codestrata-test-knowledge/
    - .codestrata-examples/
    - reports/
    - .env
  generated_during_export:
    - .codestrata-export-snapshot.json
  notes: >
    Allowlist-based export via each export's include patterns.
    Directory absence from a denylist is never sufficient for publication.

defaults:
  exclude_globs:
    - "**/.DS_Store"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/.pytest_cache/**"
    - "**/.mypy_cache/**"
    - "**/.ruff_cache/**"
    - "**/*.egg-info/**"
    - "**/.codestrata/**"
    - "**/.codestrata-examples/**"
    - "**/.codestrata-test-knowledge/**"
    - "**/.venv/**"
    - "**/venv/**"
    - "**/.env"
    - "**/.env.*"
    # Do not globally exclude "reports/**" — codestrata-docs ships docs/reports/.
    - "**/reports/showcases/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/.git/**"
    - "**/node_modules/**"
    - "**/*.sqlite"
    - "**/*.db"
    - "**/poetry.lock"
    - "**/Pipfile.lock"
    - "**/pgdata/**"
    - "**/pgdata*/**"
  forbid_path_substrings:
    - "platform/"
    - "infrastructure/"
    - "governance/reports"
    - ".codestrata/"
    - ".codestrata-examples/"
    - ".codestrata-test-knowledge/"
    - "secrets"
    - ".env"
    - "/build/"
    - "/dist/"
    - ".pytest_cache"
    - ".mypy_cache"
    - ".ruff_cache"
    - "knowledge.sqlite"
    - "mvp-acceptance"
    - "mvp-regression"
    - "MARKDOWN_AUDIT"
  forbid_content_patterns:
    - "(?i)BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY"
    - "(?i)aws_secret_access_key\\s*[=:]\\s*['\\\"]?[A-Za-z0-9/+=]{20,}"
    - "(?i)api[_-]?key\\s*=\\s*['\\\"]?[A-Za-z0-9/+=]{20,}"
  # Markdown relative targets that must not appear in exported Community docs.
  forbid_markdown_link_substrings:
    - "platform/docs"
    - "../../platform/"
    - "../../../platform/"
    - "governance/"
    - "../../governance/"
    - "../../../governance/"
    - "../../knowledge/"
    - "../../../knowledge/"
    - "../../../../knowledge/"
    - "../../docs/"
    - "../../../docs/"
    - "platform.codestrata.ai"
    - "/api/openapi"
    - "platform/api/openapi"
  documentation_boundary:
    # knowledge/ and governance/ are never public Community source roots.
    # platform/ (including platform/api/openapi internal Swagger) is never exported.
    never_export_source_roots:
      - platform
      - infrastructure
      - governance
      - knowledge
    never_export_path_globs:
      - "platform/**"
      - "platform/api/openapi/**"
      - "infrastructure/**"
      - "governance/adr/**"
      - "governance/reports/**"
    notes: >
      Public export is allowlist-based via each export's include patterns.
      Directory absence from a denylist is never sufficient for publication.
      Platform OpenAPI / Swagger (platform.codestrata.ai/api/docs) is internal-only
      and must never appear in codestrata-docs, Community repos, public sitemaps,
      or codestrata.ai navigation.

exports:
  - name: codestrata-engine
    description: Community Edition assessment engine (CLI, MCP, packaging)
    source_root: engine
    owner: CodeStrata
    repository: codestrata-engine
    destination_repository: codestrata-engine
    visibility: public
    destination_layout: flat
    include:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "schemas/**"
      - "examples/**"
      - "verification/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "LICENSE"
      - "NOTICE"
      - "PRIVACY.md"
      - "README.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "CHANGELOG.md"
      - "codestrata.toml"
      - ".env.example"
      - ".gitignore"
      - ".github/**"
    # Pull a minimal smoke fixture into the engine mirror for offline quick-start.
    extra_includes:
      - from: test-fixtures/sample-js-app
        to: test-fixtures/sample-js-app
    exclude:
      - "**/complexity/fixtures/**"
      - ".DS_Store"
      - "**/.DS_Store"
      - "reports/**"
      # Maintainer-only / leftover implementer documentation (not Community journeys).
      - "docs/COMMUNITY_EDITION_CHECKLIST.md"
      - "docs/assessment-framework/**"
      # Analysis Intelligence: ship only shared-rule-platform + rule-authoring.
      - "docs/analysis-intelligence/architecture/**"
      - "docs/analysis-intelligence/architecture-assessment/**"
      - "docs/analysis-intelligence/architecture-conclusions/**"
      - "docs/analysis-intelligence/architecture-reporting/**"
      - "docs/analysis-intelligence/dependency/**"
      - "docs/analysis-intelligence/evidence-providers/**"
      - "docs/analysis-intelligence/security/**"
      - "docs/analysis-intelligence/technical-debt/**"
      - "docs/analysis-intelligence/testing/**"
      - "docs/analysis-intelligence/evidence.md"
      - "docs/analysis-intelligence/suppression.md"
    validation:
      require_files:
        - LICENSE
        - NOTICE
        - PRIVACY.md
        - README.md
        - CHANGELOG.md
        - pyproject.toml
        - src/codestrata/__init__.py
        - src/codestrata/extensions/__init__.py
        - codestrata.toml
        - SECURITY.md
        - test-fixtures/sample-js-app/package.json
        - docs/public-contracts.md
        - docs/report-contract.md
        - docs/extension-architecture.md
        - docs/telemetry.md
        - docs/telemetry-non-interactive.md
        - docs/telemetry-cli-consent-flags.md
        - docs/telemetry-status.md
        - docs/telemetry-event-catalog.md
        - docs/telemetry-event-catalog.json
        - docs/telemetry-preview.md
        - docs/telemetry-pre-transport-privacy.md
        - docs/telemetry-transport.md
        - docs/telemetry-assessment-isolation.md
        - docs/telemetry-anonymous-analytics.md
        - docs/telemetry-installation-identity.md
        - docs/telemetry-runtime-analytics.md
        - docs/telemetry-assessment-analytics.md
        - docs/telemetry-repository-aggregate-analytics.md
        - docs/telemetry-ai-analytics.md
        - docs/ai-provider-contracts.md
        - docs/ai-provider-configuration.md
        - docs/ai-provider-execution.md
        - docs/ai-provider-capabilities.md
        - docs/ai-provider-openai.md
        - docs/ai-provider-bedrock.md
        - docs/ai-provider-platform.md
        - docs/ai-provider-openrouter.md
        - docs/ai-provider-openrouter-configuration.md
        - docs/ai-provider-openrouter-doctor.md
        - docs/ai-provider-security-boundaries.md
        - verification/cli_installation/README.md
        - schemas/telemetry/codestrata.io/v1.0/TelemetryEvent.json
        - .github/PULL_REQUEST_TEMPLATE.md
      forbid_globs:
        - "platform/**"
        - "infrastructure/**"
        - "governance/**"
        - "docs/COMMUNITY_EDITION_CHECKLIST.md"
        - "docs/analysis-intelligence/architecture/**"
        - "docs/analysis-intelligence/architecture-assessment/**"
        - "docs/analysis-intelligence/architecture-conclusions/**"
        - "docs/analysis-intelligence/architecture-reporting/**"
        - "docs/analysis-intelligence/dependency/**"
        - "docs/analysis-intelligence/evidence-providers/**"
        - "docs/analysis-intelligence/security/**"
        - "docs/analysis-intelligence/technical-debt/**"
        - "docs/analysis-intelligence/testing/**"
        - "docs/analysis-intelligence/evidence.md"
        - "docs/analysis-intelligence/suppression.md"
        - "**/reports/**"
      commands:
        - "python -m pip install -e '.[dev]'"
        - "codestrata version"
        - "codestrata assess --repo test-fixtures/sample-js-app --output /tmp/cs-engine-export-reports --no-ai"
        - "python -m pytest -q tests/config/test_settings.py"

  - name: codestrata-examples
    description: Real-world showcase manifests, fetch scripts, attribution, curated expected results
    source_root: examples
    owner: CodeStrata
    repository: codestrata-examples
    destination_repository: codestrata-examples
    visibility: public
    destination_layout: flat
    include:
      - "**"
    exclude:
      - "**/.DS_Store"
      - "**/node_modules/**"
      - "**/__pycache__/**"
      - "**/.codestrata-examples/**"
      - "**/reports/**"
      - "**/reports/showcases/**"
      - "**/sample-*-app/**"
      - "**/sample-reports/**"
      - "**/fixtures/**"
    validation:
      require_files:
        - LICENSE
        - SECURITY.md
        - README.md
        - codestrata.toml
        - real-world/README.md
        - real-world/THIRD_PARTY.md
        - real-world/MANIFEST_SCHEMA.md
        - real-world/manifests/spring-petclinic.yaml
        - real-world/manifests/dotnet-eshop.yaml
        - real-world/manifests/laravel-realworld.yaml
        - real-world/scripts/fetch_example.py
        - real-world/scripts/run_showcase.py
        - expected-results/README.md
        - expected-results/spring-petclinic/summary.md
        - expected-results/dotnet-eshop/summary.md
        - expected-results/laravel-realworld/summary.md
      forbid_globs:
        - "platform/**"
        - "infrastructure/**"
        - "**/.env"
        - "**/.codestrata-examples/**"
        - "**/reports/showcases/**"
        - "**/sample-*-app/**"
        - "sample-*/**"
        - "**/sample-reports/**"
        - "fixtures/**"
  - name: codestrata-vscode
    description: CodeStrata VS Code Extension (Community Engine client; private mirror)
    source_root: vscode-plugin
    owner: CodeStrata
    repository: codestrata-vscode
    destination_repository: codestrata-vscode
    visibility: private
    destination_layout: flat
    include:
      - "**"
    exclude:
      - ".DS_Store"
      - "**/.DS_Store"
      - "node_modules/**"
      - "**/node_modules/**"
      - "out/**"
      - "*.vsix"
      - ".vscode-test/**"
      - "**/.vscode-test/**"
      - "PLACEHOLDER.md"
      - ".vscode/**"
    validation:
      require_files:
        - README.md
        - CHANGELOG.md
        - LICENSE
        - SECURITY.md
        - package.json
        - src/extension.ts
        - tsconfig.json
        - media/codestrata-icon.png
        - testdata/sample-assessment-run/findings.json
        - testdata/sample-assessment-run/report.json
      forbid_globs:
        - "platform/**"
        - "infrastructure/**"
        - "governance/**"
        - "**/*.py"
        - "PLACEHOLDER.md"
        - "*.vsix"
        - "out/**"
        - ".vscode-test/**"
        - ".vscode/**"
      commands:
        - "npm install"
        - "npm test"
        - "npm run package:dry"

  - name: codestrata-docs
    description: CodeStrata documentation portal source (private mirror; docs.codestrata.ai)
    source_root: docs
    owner: CodeStrata
    repository: codestrata-docs
    destination_repository: codestrata-docs
    visibility: private
    destination_layout: flat
    include:
      - "**"
    exclude:
      - ".DS_Store"
      - "**/.DS_Store"
      - "node_modules/**"
      - "**/node_modules/**"
      - ".vitepress/dist/**"
      - ".vitepress/cache/**"
      - ".wrangler/**"
      - "**/.wrangler/**"
      - "visual-baselines/**"
      - ".tmp*"
      - "internal/**"
    validation:
      require_files:
        - README.md
        - ARCHITECTURE.md
        - CONTRIBUTING.md
        - LICENSE
        - SECURITY.md
        - SUPPORT.md
        - PRIVACY.md
        - MIGRATION_PLAN.md
        - DEPLOYMENT.md
        - EXTRACTION.md
        - CI.md
        - package.json
        - package-lock.json
        - index.md
        - .vitepress/config.ts
        - .vitepress/theme/index.ts
        - .vitepress/theme/tokens.css
        - public/favicon.svg
        - public/robots.txt
        - WEBSITE_STYLE_ALIGNMENT.md
        - VISUAL_REGRESSION.md
        - public/design-tokens/tokens.css
        - public/fonts.css
        - public/brand/lockup-horizontal-on-dark.svg
        - scripts/visual-capture.mjs
        - scripts/validate.mjs
        - scripts/deploy-check.mjs
        - wrangler.jsonc
        - policies/documentation_deployment_policy.json
        - getting-started/index.md
        - extensions/vscode.md
        - extensions/cursor.md
        - community/vs-platform.md
        - reports/index.md
      forbid_globs:
        - "governance/**"
        - "infrastructure/**"
        - "visual-baselines/**"
        - ".wrangler/**"
        - "internal/**"
        - "**/*.py"
        - "node_modules/**"
        - "platform/src/**"
        - "platform/docs/**"
      commands:
        - "npm ci"
        - "npm test"
