# Monorepo workspace tooling for codestrata-platform.
# The installable Community Engine package lives in ./engine (see engine/pyproject.toml).
# Implemented commercial capabilities live in ./platform (see platform/pyproject.toml).
#
# Development install:
#   pip install -e "./engine[dev,mcp]"
#   pip install -e "./platform[dev,mcp,pgvector]"
#
# Public exports are defined in public-export-manifest.yaml.

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "codestrata-platform-workspace"
version = "0.2.0"
description = "Private monorepo workspace for CodeStrata (not published)."
requires-python = ">=3.12"
readme = "README.md"
dependencies = []


[tool.pytest.ini_options]
testpaths = ["engine/tests", "platform/tests", "tests"]
pythonpath = ["engine/src", "platform/src", "platform", "platform/tests", "."]
norecursedirs = [".git", ".venv", ".codestrata", "fixtures", "__pycache__", "*.egg-info"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m not network",
]
markers = [
    "docker: requires Docker Compose and a running daemon (skipped when unavailable)",
    "network: requires outbound network (GitHub); excluded from default offline CI",
]


[tool.ruff]
target-version = "py312"
line-length = 100
src = ["engine/src", "engine/tests", "platform/src", "platform/tests", "tests", "scripts"]
exclude = [
    "**/complexity/fixtures/**",
    ".export-staging",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.mypy]
python_version = "3.12"
strict = true
files = ["engine/src"]
mypy_path = ["engine/src"]
explicit_package_bases = true
pretty = true
show_error_codes = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "boto3",
    "botocore.*",
    "mcp.*",
    "openai",
]
ignore_missing_imports = true
