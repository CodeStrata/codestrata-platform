RiskSummaryResponse:
  properties:
    graph_id:
      type: string
      title: Graph Id
    graph_version:
      type: integer
      title: Graph Version
    engineering_snapshot_id:
      type: string
      title: Engineering Snapshot Id
    generated_at:
      type: string
      format: date-time
      title: Generated At
    by_severity:
      additionalProperties:
        type: integer
      type: object
      title: By Severity
    by_category:
      additionalProperties:
        type: integer
      type: object
      title: By Category
    hotspots:
      items:
        $ref: '#/components/schemas/RiskHotspotResponse'
      type: array
      title: Hotspots
    unresolved_finding_ids:
      items:
        type: string
      type: array
      title: Unresolved Finding Ids
  additionalProperties: false
  type: object
  required:
  - graph_id
  - graph_version
  - engineering_snapshot_id
  - generated_at
  - by_severity
  - by_category
  - hotspots
  - unresolved_finding_ids
  title: RiskSummaryResponse
