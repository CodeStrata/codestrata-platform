BuildRetrievalIndexRequest:
  properties:
    snapshot_id:
      type: string
      maxLength: 160
      minLength: 1
      title: Snapshot Id
    graph_id:
      anyOf:
      - type: string
        maxLength: 160
        minLength: 1
      - type: 'null'
      title: Graph Id
    embedding_provider:
      anyOf:
      - type: string
        maxLength: 64
        minLength: 1
      - type: 'null'
      title: Embedding Provider
    embedding_model:
      anyOf:
      - type: string
        maxLength: 128
        minLength: 1
      - type: 'null'
      title: Embedding Model
    embedding_dimension:
      anyOf:
      - type: integer
        maximum: 8192.0
        minimum: 1.0
      - type: 'null'
      title: Embedding Dimension
  additionalProperties: false
  type: object
  required:
  - snapshot_id
  title: BuildRetrievalIndexRequest
