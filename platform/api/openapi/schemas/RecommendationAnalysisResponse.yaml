RecommendationAnalysisResponse:
  properties:
    graph_id:
      type: string
      title: Graph Id
    graph_version:
      type: integer
      title: Graph Version
    engineering_snapshot_id:
      type: string
      title: Engineering Snapshot Id
    generated_at:
      type: string
