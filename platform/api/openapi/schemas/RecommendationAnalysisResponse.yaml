      type: integer
      title: Conflict Count
  additionalProperties: false
  type: object
  required:
  - graph_id
  - graph_version
  - engineering_snapshot_id
  - generated_at
  - total
  - linked_to_findings
  - execution_order
  - cycles
  - conflict_count
  title: RecommendationAnalysisResponse
