paths:
  /api/v1/assessments/{assessment_id}/findings:
    get:
      tags:
      - Assessment Intelligence
      summary: List assessment findings
      operationId: list_findings_api_v1_assessments__assessment_id__findings_get
      parameters:
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
          title: Assessment Id
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Severity
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FindingSummaryResponse'
                title: Response List Findings Api V1 Assessments  Assessment Id  Findings
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-codestrata-status: implemented
      x-codestrata-owner: platform-assessments
      x-codestrata-audience: internal
