paths:
  /api/v1/engineering/snapshots:
    post:
      tags:
      - Engineering Intelligence
      summary: Build Engineering Snapshot
      description: Build an Engineering Snapshot from assessment intelligence for
        Platform consumers (Knowledge Graph, retrieval, portfolio). Not a Community
        Engine local assessment run.
      operationId: build_snapshot_api_v1_engineering_snapshots_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codestrata_platform__api__controllers__engineering__BuildSnapshotRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotDetailsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-codestrata-status: implemented
      x-codestrata-owner: platform-engineering
      x-codestrata-audience: internal
    get:
      tags:
      - Engineering Intelligence
      summary: List Snapshots
      operationId: list_snapshots_api_v1_engineering_snapshots_get
      parameters:
      - name: assessment_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          title: Assessment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SnapshotSummaryResponse'
                title: Response List Snapshots Api V1 Engineering Snapshots Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-codestrata-status: implemented
      x-codestrata-owner: platform-engineering
      x-codestrata-audience: internal
  /api/v1/engineering/snapshots/{snapshot_id}:
    get:
      tags:
      - Engineering Intelligence
      summary: Get Snapshot
      operationId: get_snapshot_api_v1_engineering_snapshots__snapshot_id__get
      parameters:
      - name: snapshot_id
        in: path
        required: true
        schema:
          type: string
          title: Snapshot Id
      responses:
        '200':
          description: Successful Response
