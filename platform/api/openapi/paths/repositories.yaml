paths:
  /api/v1/repositories:
    post:
      tags:
      - Repositories
      summary: Register repository
      operationId: register_repository_api_v1_repositories_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRepositoryRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-codestrata-status: implemented
      x-codestrata-owner: platform-tenancy
      x-codestrata-audience: internal
    get:
      tags:
      - Repositories
      summary: List repositories
      operationId: list_repositories_api_v1_repositories_get
      parameters:
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Id
      - name: organization_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Organization Id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Size
      - name: sort
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sort
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseDto_RepositorySummaryResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-codestrata-status: implemented
      x-codestrata-owner: platform-tenancy
      x-codestrata-audience: internal
  /api/v1/repositories/{repository_id}:
    get:
      tags:
      - Repositories
      summary: Get repository
      operationId: get_repository_api_v1_repositories__repository_id__get
      parameters:
      - name: repository_id
        in: path
        required: true
        schema:
          type: string
          title: Repository Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-codestrata-status: implemented
      x-codestrata-owner: platform-tenancy
      x-codestrata-audience: internal
    patch:
      tags:
      - Repositories
      summary: Update repository (rename / metadata)
      operationId: update_repository_api_v1_repositories__repository_id__patch
      parameters:
      - name: repository_id
        in: path
        required: true
        schema:
          type: string
          title: Repository Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRepositoryRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-codestrata-status: implemented
      x-codestrata-owner: platform-tenancy
      x-codestrata-audience: internal
    delete:
      tags:
      - Repositories
      summary: Archive repository (logical delete)
      operationId: archive_repository_api_v1_repositories__repository_id__delete
      parameters:
      - name: repository_id
        in: path
        required: true
        schema:
          type: string
          title: Repository Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-codestrata-status: implemented
      x-codestrata-owner: platform-tenancy
      x-codestrata-audience: internal
  /api/v1/repositories/{repository_id}/assessments:
    get:
      tags:
      - Repositories
      summary: Repository assessment history
      operationId: list_repository_assessments_api_v1_repositories__repository_id__assessments_get
      parameters:
      - name: repository_id
        in: path
        required: true
        schema:
          type: string
          title: Repository Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssessmentResponse'
                title: Response List Repository Assessments Api V1 Repositories  Repository
                  Id  Assessments Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-codestrata-status: implemented
      x-codestrata-owner: platform-tenancy
      x-codestrata-audience: internal
