paths:
  /api/v1/ingestion/repositories:
    post:
      tags:
      - Ingestion
      summary: Register repository from Engine
      operationId: ingest_register_repository_api_v1_ingestion_repositories_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRepositoryRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestRepositoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-codestrata-status: implemented
      x-codestrata-owner: platform-ingestion
      x-codestrata-audience: internal
  /api/v1/ingestion/repositories/lookup:
    get:
      tags:
      - Ingestion
      summary: Lookup repository by workspace and URL
      operationId: ingest_lookup_repository_api_v1_ingestion_repositories_lookup_get
      parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          title: Workspace Id
      - name: repository_url
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          title: Repository Url
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestRepositoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-codestrata-status: implemented
      x-codestrata-owner: platform-ingestion
      x-codestrata-audience: internal
