      type: object
      description: Stable Platform API error detail
      properties:
        code:
          type: string
          description: Machine-readable error code
          examples:
          - unauthorized
          - not_found
          - validation_error
        message:
          type: string
          description: Human-readable, sanitized guidance
        details:
          type: object
          additionalProperties: true
          nullable: true
          description: Optional structured detail
      required:
      - code
      - message
    ErrorResponseDto:
      type: object
      description: Standard Platform API error envelope
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetailDto'
      required:
      - error
      example:
        error:
          code: unauthorized
          message: 'Missing or invalid Authorization header. Send Authorization: Bearer
            <key> using CODESTRATA_PLATFORM_API_KEY.'
          details: null
    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details (PROPOSED mapping alongside ErrorResponseDto).
        Not yet the runtime envelope.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
      required:
      - type
      - title
      - status
      x-codestrata-status: proposed
