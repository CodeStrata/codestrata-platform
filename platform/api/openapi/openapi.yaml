      - running
      - succeeded
      - failed
      - cancelled
      description: Async job status vocabulary (shared)
      x-codestrata-status: implemented
  securitySchemes:
    PlatformApiKey:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'CodeStrata Platform shared API key from `CODESTRATA_PLATFORM_API_KEY`.
        Send as `Authorization: Bearer <api-key>`. This is not an AI provider credential
        (Bedrock/OpenAI/etc.).'
    PlatformJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: PROPOSED user/session JWT. Not implemented.
      x-codestrata-status: proposed
    PlatformOidc:
      type: oauth2
      description: PROPOSED SSO / OIDC. Not implemented.
      x-codestrata-status: proposed
      flows:
        authorizationCode:
          authorizationUrl: https://platform.codestrata.ai/oauth/authorize
          tokenUrl: https://platform.codestrata.ai/oauth/token
          scopes:
            platform.read: Read Platform resources
            platform.write: Mutate Platform resources
tags:
- name: Organizations
  description: Organization lifecycle for multi-user Platform tenancy.
- name: Workspaces
  description: Workspace lifecycle within an organization.
- name: Repositories
  description: Repository Registry — tracked engineering repositories.
- name: Assessments
  description: Engineering Assessment records registered on the Platform.
- name: Assessment Intelligence
  description: Findings, metrics, and recommendations for an assessment.
- name: Ingestion
  description: Engine → Platform registration of repositories and assessments.
- name: Ingestion Artifacts
  description: Opt-in upload of assessment artifacts (reports, bundles).
- name: Ingestion Intelligence
  description: Ingest and process assessment intelligence payloads.
- name: Engineering Intelligence
  description: Engineering Snapshot build and query for Platform consumers.
- name: Knowledge Graphs
  description: Engineering Knowledge Graph lifecycle and graph reads.
- name: Knowledge Graph Intelligence
  description: Impact, traceability, coverage, and risk views over a graph.
- name: Retrieval
  description: Repository Retrieval indexes, search, and context.
- name: Answering
  description: Grounded Repository Answering over retrieval indexes.
- name: Portfolio
  description: Portfolio Intelligence — portfolios and portfolio snapshots.
- name: Portfolio Retrieval
  description: Portfolio-scoped retrieval indexes.
- name: Portfolio Answering
  description: Grounded answering across a portfolio.
- name: Executive Intelligence
  description: Executive Intelligence build and query for a portfolio.
- name: Executive Presentation
  description: On-read Executive Intelligence presentation views.
- name: Strategic Portfolio Roadmap
  description: On-read Strategic Roadmap views (Platform; not Engine roadmap).
- name: Health
  description: Liveness and readiness probes (no API key required).
security:
- PlatformApiKey: []
servers:
- url: https://platform.codestrata.ai
  description: Internal Platform hostname (API under /api/v1)
- url: http://127.0.0.1:8000
  description: Local development (uvicorn) when enabled
x-codestrata-public-contract:
  api_major: v1
  compatibility_policy: governance/playbooks/PUBLIC_CONTRACT_COMPATIBILITY.md
  error_envelope: ErrorResponseDto
x-codestrata-contract:
  canonical: platform/api/openapi/openapi.yaml
  swagger_projection: /api/docs
  openapi_yaml: /api/openapi.yaml
  openapi_json: /api/openapi.json
  audience: internal
  public_export: false
  community_schema_reuse:
    assessment_report: engine/schemas/assessment/codestrata.io/v1.2/AssessmentReport.json
    policy: Extend Community contracts; do not duplicate them.
  versioning:
    url_prefix: /api/v1
    breaking_change: New major path (/api/v2)
    within_major: Additive only; clients ignore unknown fields
    deprecation: Announce in release notes; retain ≥1 minor cycle
  error_model:
    implemented: ErrorResponseDto
    preferred_future: RFC 9457 Problem Details (proposed mapping)
  authentication:
    implemented: PlatformApiKey (HTTP Bearer shared secret)
    proposed:
    - JWT
    - SSO / OIDC
    - Internal service identity
