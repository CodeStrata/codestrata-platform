# CodeStrata monorepo CI (Slice 12.9 + Slice 20.12B)
#
# Validates Engine, Platform, VS Code, independent Community / Infrastructure
# export targets, and Epic 20 transparency claim guards. Does NOT: publish,
# deploy, tag, push remotes, plan/apply/destroy, or configure AWS credentials
# for export validation.
#
# Active editor extension: VS Code only (Cursor retired Slice 12.1–12.2).
# Export command: python scripts/export_repository.py --target <community|infrastructure>
#
# Jobs (7):
#   engine-tests, platform-tests, vscode-ci,
#   community-export-verification, infrastructure-export-verification,
#   ci-release-boundaries, epic20-transparency-claims

name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: engine-tests
    if: github.repository == 'CodeStrata/codestrata-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      TERM: dumb
      FORCE_COLOR: "0"
      COLUMNS: "120"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            pyproject.toml
      - name: Install Engine test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e "./engine[dev]"
      - name: Engine unit tests (focused)
        working-directory: engine
        run: python -m pytest tests -q --tb=line -x -q --maxfail=5 --import-mode=importlib
        continue-on-error: false

  platform-tests:
    name: platform-tests
    if: github.repository == 'CodeStrata/codestrata-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            platform/pyproject.toml
            pyproject.toml
      - name: Install Platform test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e "./engine[dev]"
          python -m pip install -e "./platform[dev]"
      - name: Install PostgreSQL 16 pgvector
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16-pgvector
          test -f /usr/share/postgresql/16/extension/vector.control
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          sudo systemctl stop postgresql.service
      - name: Platform unit tests (focused)
        working-directory: platform
        run: python -m pytest tests -q --tb=line --maxfail=5

  vscode-ci:
    name: vscode-ci
    if: github.repository == 'CodeStrata/codestrata-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vscode-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-plugin/package-lock.json
      - name: Install
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Test
        run: npm test
      - name: Package dry validation
        run: npm run package:dry
      # Marketplace publish is intentionally NOT invoked here.

  community-export-verification:
    name: community-export-verification
    if: github.repository == 'CodeStrata/codestrata-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verification dependencies
        run: |
          python -m pip install -U pip
          python -m pip install PyYAML
      - name: Community export dry-run
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          AWS_PROFILE: ""
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          DEST="${RUNNER_TEMP}/community-export"
          mkdir -p "${RUNNER_TEMP}"
          python scripts/export_repository.py \
            --target community \
            --destination "${DEST}" \
            --dry-run
          test ! -e "${DEST}"
      - name: Community export (temporary staging)
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          AWS_PROFILE: ""
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          DEST="${RUNNER_TEMP}/community-export"
          python scripts/export_repository.py \
            --target community \
            --destination "${DEST}"
          test -d "${DEST}/codestrata-engine"
          test -d "${DEST}/codestrata-vscode"
          test ! -d "${DEST}/codestrata-cursor"
          test ! -d "${DEST}/codestrata-infrastructure"
      - name: Slice 12.8 target-router verification (authoritative)
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          PYTHONPATH=. python -m verification.repository_export_targets
      # No git init/commit/push in export tree. No artifact upload of export trees.

  infrastructure-export-verification:
    name: infrastructure-export-verification
    if: github.repository == 'CodeStrata/codestrata-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.5"
      - name: Install verification dependencies
        run: |
          python -m pip install -U pip
          python -m pip install PyYAML pytest
      - name: Scrub AWS credentials for validation
        run: |
          echo "AWS_ACCESS_KEY_ID=" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=" >> "$GITHUB_ENV"
          echo "AWS_PROFILE=" >> "$GITHUB_ENV"
          echo "AWS_EC2_METADATA_DISABLED=true" >> "$GITHUB_ENV"
      - name: Infrastructure export dry-run
        run: |
          DEST="${RUNNER_TEMP}/infrastructure-export"
          python scripts/export_repository.py \
            --target infrastructure \
            --destination "${DEST}" \
            --dry-run
          test ! -e "${DEST}"
      - name: Infrastructure export (temporary directory)
        run: |
          DEST="${RUNNER_TEMP}/infrastructure-export"
          python scripts/export_repository.py \
            --target infrastructure \
            --destination "${DEST}"
          test -f "${DEST}/export-manifest.json"
          test -f "${DEST}/export-inventory.json"
          test -f "${DEST}/SHA256SUMS"
          test -d "${DEST}/modules"
          test ! -d "${DEST}/engine"
          test ! -d "${DEST}/platform"
          test ! -d "${DEST}/vscode-plugin"
          test ! -d "${DEST}/cursor-plugin"
          test ! -d "${DEST}/infrastructure"
      - name: Exported Infrastructure pytest (no monorepo PYTHONPATH)
        working-directory: ${{ runner.temp }}/infrastructure-export
        env:
          PYTHONPATH: ""
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          python -m pytest tests -q --tb=line
      - name: OpenTofu fmt / init -backend=false / validate
        working-directory: ${{ runner.temp }}/infrastructure-export
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          AWS_PROFILE: ""
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          tofu fmt -check -recursive
          for root in modules/community-cloud-api modules/community-data-lake production; do
            echo "=== validate ${root} ==="
            (cd "${root}" && tofu init -backend=false -input=false && tofu validate)
          done
      # Forbidden in this job: tofu plan|apply|destroy, aws cli, git init/push/tag,
      # configure-aws-credentials, contents:write, artifact upload of export tree.

  ci-release-boundaries:
    name: ci-release-boundaries
    if: github.repository == 'CodeStrata/codestrata-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install PyYAML pytest
      - name: Slice 12.9 CI/release boundary verification
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          PYTHONPATH=. python -m verification.ci_release_boundaries
      - name: Focused unit tests
        run: |
          PYTHONPATH=. python -m pytest tests/verification/ci_release_boundaries -q --tb=line

  # Slice 20.12B — monorepo Epic 20 transparency / consent claim guards.
  # Exists so documentation regressions fail the clean runner (not only local runs).
  epic20-transparency-claims:
    name: epic20-transparency-claims
    if: github.repository == 'CodeStrata/codestrata-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      NO_COLOR: "1"
      TERM: dumb
      FORCE_COLOR: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            platform/pyproject.toml
            pyproject.toml
      - name: Install Engine + Platform (verification imports)
        run: |
          python -m pip install -U pip
          python -m pip install -e "./engine[dev]"
          python -m pip install -e "./platform[dev]"
      - name: Slice 20.12 claim guards (mandatory hard fail)
        run: |
          PYTHONPATH=. python -m pytest \
            tests/verification/community_telemetry_data_transparency/test_slice_20_12_claim_guards.py \
            -v --tb=short --import-mode=importlib
      - name: Epic 20 transparency / consent / marketplace packs
        run: |
          # --import-mode=importlib avoids colliding test_package.py module names.
          PYTHONPATH=. python -m pytest \
            tests/verification/community_telemetry_data_transparency/test_package.py \
            tests/verification/community_telemetry_consent/test_community_telemetry_consent.py \
            tests/verification/community_public_claim_runtime_validation/test_package.py \
            tests/verification/community_privacy_retention_optout/test_package.py \
            tests/verification/vscode_marketplace_docs/test_docs.py \
            -q --tb=line --import-mode=importlib
