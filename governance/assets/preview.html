<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeStrata brand assets</title>
<style>
  body { margin: 0; font: 14px/1.5 "Inter", -apple-system, sans-serif; background: #0b0d10; color: #9aa3ae; }
  h1 { font-size: 1.2rem; color: #edeff2; padding: 2rem 2rem 0; }
  h2 { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: #6b7480; padding: 0 2rem; margin: 2.5rem 0 .75rem; }
  .grid { display: flex; flex-wrap: wrap; gap: 1rem; padding: 0 2rem; }
  figure { margin: 0; }
  figcaption { font-family: ui-monospace, monospace; font-size: .7rem; color: #6b7480; margin-top: .4rem; }
  .cell { border: 1px solid #232830; border-radius: 10px; padding: 1.5rem 2rem; display: flex; align-items: center; justify-content: center; }
  .dark { background: #0b0d10; } .light { background: #ffffff; }
  .checker { background: repeating-conic-gradient(#1a1e25 0 25%, #14171c 0 50%) 0 0 / 20px 20px; }
  footer { padding: 2rem; font-size: .75rem; color: #6b7480; }
</style>
</head>
<body>
<h1>CodeStrata brand assets</h1>

<h2>Horizontal lockup</h2>
<div class="grid">
  <figure><div class="cell dark"><img src="svg/lockup-horizontal-on-dark.svg" height="52" alt=""></div><figcaption>lockup-horizontal-on-dark</figcaption></figure>
  <figure><div class="cell light"><img src="svg/lockup-horizontal-on-light.svg" height="52" alt=""></div><figcaption>lockup-horizontal-on-light</figcaption></figure>
  <figure><div class="cell checker"><img src="svg/lockup-horizontal-mono-white.svg" height="52" alt=""></div><figcaption>lockup-horizontal-mono-white</figcaption></figure>
  <figure><div class="cell light"><img src="svg/lockup-horizontal-mono-black.svg" height="52" alt=""></div><figcaption>lockup-horizontal-mono-black</figcaption></figure>
</div>

<h2>Stacked lockup</h2>
<div class="grid">
  <figure><div class="cell dark"><img src="svg/lockup-stacked-on-dark.svg" height="130" alt=""></div><figcaption>lockup-stacked-on-dark</figcaption></figure>
  <figure><div class="cell light"><img src="svg/lockup-stacked-on-light.svg" height="130" alt=""></div><figcaption>lockup-stacked-on-light</figcaption></figure>
</div>

<h2>Wordmark</h2>
<div class="grid">
  <figure><div class="cell dark"><img src="svg/wordmark-on-dark.svg" height="36" alt=""></div><figcaption>wordmark-on-dark</figcaption></figure>
  <figure><div class="cell light"><img src="svg/wordmark-on-light.svg" height="36" alt=""></div><figcaption>wordmark-on-light</figcaption></figure>
  <figure><div class="cell checker"><img src="svg/wordmark-mono-white.svg" height="36" alt=""></div><figcaption>wordmark-mono-white</figcaption></figure>
  <figure><div class="cell light"><img src="svg/wordmark-mono-black.svg" height="36" alt=""></div><figcaption>wordmark-mono-black</figcaption></figure>
</div>

<h2>Icon</h2>
<div class="grid">
  <figure><div class="cell checker"><img src="svg/icon.svg" width="64" alt=""></div><figcaption>icon</figcaption></figure>
  <figure><div class="cell dark"><img src="svg/icon-tile-dark.svg" width="64" alt=""></div><figcaption>icon-tile-dark</figcaption></figure>
  <figure><div class="cell light"><img src="svg/icon-tile-light.svg" width="64" alt=""></div><figcaption>icon-tile-light</figcaption></figure>
  <figure><div class="cell checker"><img src="svg/icon-mono-white.svg" width="64" alt=""></div><figcaption>icon-mono-white</figcaption></figure>
  <figure><div class="cell light"><img src="svg/icon-mono-black.svg" width="64" alt=""></div><figcaption>icon-mono-black</figcaption></figure>
</div>

<h2>Social</h2>
<div class="grid">
  <figure><img src="social/avatar-dark-1024.png" width="120" style="border-radius:12px" alt=""><figcaption>avatar-dark-1024</figcaption></figure>
  <figure><img src="social/avatar-light-1024.png" width="120" style="border-radius:12px" alt=""><figcaption>avatar-light-1024</figcaption></figure>
  <figure><img src="social/avatar-stacked-dark-1024.png" width="120" style="border-radius:12px" alt=""><figcaption>avatar-stacked-dark-1024</figcaption></figure>
  <figure><img src="social/banner-x-1500x500.png" width="390" alt=""><figcaption>banner-x-1500x500</figcaption></figure>
  <figure><img src="social/banner-linkedin-1584x396.png" width="390" alt=""><figcaption>banner-linkedin-1584x396</figcaption></figure>
</div>

<footer>SVGs in <code>svg/</code> are the masters. PNG exports live in <code>png/</code>, <code>social/</code>, <code>favicon/</code>. See README.md for usage.</footer>
</body>
</html>
