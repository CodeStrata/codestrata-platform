# codestrata-insights — Cloudflare production deploy (owner secrets required).
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "workers/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: insights-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'CodeStrata/codestrata-insights'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run deploy:check
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Cloudflare secrets not configured; skipping live deploy."
            echo "owner_configuration_required=true"
            exit 0
          fi
          npm run deploy:upload
